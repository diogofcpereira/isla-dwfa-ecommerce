components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    Car:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: integer
        brand_name:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 32
        model:
          type: string
          maxLength: 80
        version:
          type: string
          maxLength: 80
        year:
          type: integer
          maximum: 32767
          minimum: 0
        fuel:
          $ref: '#/components/schemas/FuelEnum'
        fuel_display:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - brand_name
      - code
      - created_at
      - fuel
      - fuel_display
      - id
      - model
      - price
      - year
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          maxLength: 20
        address:
          type: string
      required:
      - email
      - id
      - user
      - username
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        customer:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        scheduled_for:
          type: string
          format: date-time
        address:
          type: string
          maxLength: 255
        notes:
          type: string
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - customer
      - delivered_at
      - id
      - order
      - scheduled_for
      - status
      - status_display
    DeliveryStatusEnum:
      enum:
      - scheduled
      - in_transit
      - delivered
      type: string
      description: |-
        * `scheduled` - Agendada
        * `in_transit` - Em trânsito
        * `delivered` - Entregue
    FuelEnum:
      enum:
      - petrol
      - diesel
      - hybrid
      - electric
      type: string
      description: |-
        * `petrol` - Gasolina
        * `diesel` - Gasóleo
        * `hybrid` - Híbrido
        * `electric` - Elétrico
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        groups:
          type: array
          items:
            type: string
      required:
      - groups
      - id
      - username
    MethodEnum:
      enum:
      - transfer
      - financing
      - card
      - mbway
      type: string
      description: |-
        * `transfer` - Transferência
        * `financing` - Financiamento
        * `card` - Cartão
        * `mbway` - MB WAY
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - created_at
      - customer
      - id
      - items
      - status
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        car:
          type: integer
        car_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - car
      - car_name
      - id
      - order
      - quantity
      - unit_price
    OrderLine:
