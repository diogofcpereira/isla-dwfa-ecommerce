name: CI

on:
  push:
  pull_request:

jobs:
  # Backend (M1): o nome "test" fica igual — é o check obrigatório da proteção do main.
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: dwfa
          POSTGRES_USER: dwfa
          POSTGRES_PASSWORD: dwfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dwfa -d dwfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://dwfa:dwfa@localhost:5432/dwfa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  # Frontend (M2): tipos, lint, formatação, testes e build da SPA.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run check:lint
      - run: npm run check:format
      - run: npm run test:ci
      - run: npm run build-only
