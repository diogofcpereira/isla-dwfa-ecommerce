name: CI

on:
  push:
  pull_request:

jobs:
  # Backend (M1): o nome "test" fica igual — é o check obrigatório da proteção do main.
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: dwfa
          POSTGRES_USER: dwfa
          POSTGRES_PASSWORD: dwfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dwfa -d dwfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://dwfa:dwfa@localhost:5432/dwfa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      # M2 (extra): o schema.yaml commitado tem de ser o que a API gera hoje — sem avisos.
      # Se alguém mudar um serializer e se esquecer de o regenerar, o CI fica vermelho.
      - name: schema.yaml em dia com a API
        run: |
          uv run python manage.py spectacular --file schema.yaml --validate --fail-on-warn
          git diff --exit-code schema.yaml
      - run: uv run pytest

  # Frontend (M2): tipos, lint, formatação, testes e build da SPA.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # M2 (extra): os tipos da SPA têm de ter sido gerados a partir do schema.yaml commitado.
      - name: schema.d.ts em dia com o schema.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run type-check
      - run: npm run check:lint
      - run: npm run check:format
      - run: npm run test:ci
      - run: npm run build-only

  # M2 (extra): o mesmo arranque que o professor faz num clone limpo, em cada push.
  # Constrói as imagens, sobe o compose.prod.yaml, migra, semeia e testa por HTTP.
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    env:
      COMPOSE: docker compose -f compose.prod.yaml
    steps:
      - uses: actions/checkout@v4
      - name: .env a partir do .env.example (como num clone limpo)
        run: cp .env.example .env
      - name: Construir e arrancar (espera pelos healthchecks)
        run: $COMPOSE up --build -d --wait
      - name: Migrar e semear
        run: |
          $COMPOSE exec -T backend python manage.py migrate --noinput
          $COMPOSE exec -T backend python manage.py seed
      - name: check --deploy com HTTPS ligado (o que valeria num deploy a sério)
        run: $COMPOSE exec -T -e DJANGO_HTTPS=True backend python manage.py check --deploy --fail-level WARNING
      - name: Testes de fumo por HTTP (Nginx → SPA e API)
        run: |
          set -e
          curl -fsS http://localhost/ | grep -q '<div id="app"></div>'
          curl -fsS http://localhost/cars/7 | grep -q '<div id="app"></div>'   # F5 numa rota da SPA
          curl -fsS http://localhost/api/health/ | grep -q '"db": "ok"'
          curl -fsS 'http://localhost/api/v1/cars/?search=golf' | grep -q '"count"'
          curl -fsS -X POST http://localhost/api/v1/auth/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username": "ana", "password": "drivenow-demo-2026"}' | grep -q '"access"'
          curl -fsSI http://localhost/ | grep -qi '^x-frame-options: DENY'
          echo "Tudo a responder."
      - name: Logs (só se algo falhou)
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Desligar
        if: always()
        run: $COMPOSE down -v