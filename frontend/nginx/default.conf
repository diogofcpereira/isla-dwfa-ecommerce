# frontend/nginx/default.conf — um só endereço (http://localhost) para tudo:
#   /           → a SPA (index.html; o Vue Router trata do resto do caminho)
#   /assets/    → JS e CSS do build, com hash no nome: cache de 1 ano
#   /api/ e /admin/ → proxy para o Gunicorn (serviço "backend" do compose)
#   /static/    → os estáticos do Django (admin), num volume partilhado com o backend
# Cabeçalhos: security-headers.conf em todas as locations com add_header; a CSP
# (spa-security-headers.conf) só na SPA.

server {
    listen 80;
    server_name _;
    server_tokens off; # não anuncia a versão do Nginx

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # O DNS interno do Docker. Com o endereço numa variável, o Nginx volta a perguntar o IP
    # do "backend" (no máximo a cada 10 s): depois de um `compose restart backend`, o
    # contentor novo pode ter outro IP e, sem isto, o Nginx dava 502 até ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # ---- API e admin: o Django responde ----
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host; # com a porta: o Django valida o ALLOWED_HOSTS
        proxy_set_header X-Real-IP $remote_addr; # o throttle do login conta por IP real
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s; # API parada: a SPA mostra o erro em segundos, não num minuto
    }

    location /admin/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s; # API parada: a SPA mostra o erro em segundos, não num minuto
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- a SPA ----
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/spa-security-headers.conf; # CSP: só JS/CSS/pedidos da nossa origem
        add_header Cache-Control "no-cache"; # o index.html revalida sempre: um deploy novo chega já
        # /cars/7 não existe como ficheiro → devolve o index.html e o Vue Router mostra o ecrã.
        # Sem isto, um F5 em /cars/7 dava 404 do Nginx.
        try_files $uri $uri/ /index.html;
    }
}