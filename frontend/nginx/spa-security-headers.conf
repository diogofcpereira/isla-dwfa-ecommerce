# frontend/nginx/spa-security-headers.conf — extra do M2: cabeçalhos só para a SPA
# (index.html e /assets/), incluídos a seguir ao security-headers.conf.
#
# Content-Security-Policy: o browser só executa JS, CSS e pedidos da nossa própria origem.
# Um script injetado (XSS) ou carregado de outro site é bloqueado, mesmo que chegue à página.
# O build do Vite não tem scripts nem estilos inline, por isso nada precisa de 'unsafe-inline'.
# Não se aplica a /api/ nem a /admin/: o Swagger (/api/docs/) carrega a interface de uma CDN.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Outra janela aberta a partir da nossa (window.open) não consegue mexer nesta.
add_header Cross-Origin-Opener-Policy "same-origin" always;