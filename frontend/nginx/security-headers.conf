# frontend/nginx/security-headers.conf — incluído em CADA location que tenha add_header.
# Atenção (armadilha clássica do Nginx): um add_header dentro de uma location anula TODOS
# os add_header herdados do server. Por isso os cabeçalhos vivem aqui e são incluídos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;