services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dwfa
      POSTGRES_USER: dwfa
      POSTGRES_PASSWORD: dwfa
    ports: ["5432:5432"]          # porta 5432 ocupada? · port busy? → "5433:5432" e DATABASE_URL com :5433
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwfa -d dwfa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    # Ficha 05: broker do Celery (/0), resultados das tarefas (/0) e cache do Django (/1)
    image: redis:7-alpine
    ports: ["6379:6379"]          # porta 6379 ocupada? → "6380:6379" e REDIS_URL com :6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
