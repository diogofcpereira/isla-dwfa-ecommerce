[project]
name = "isla-dwfa-ecommerce"
version = "0.1.0"
description = "DWFA 2026/27 · esqueleto do projeto e-commerce · e-commerce project skeleton"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "factory-boy>=3.3",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts", "core", "shop"]

# M2 (extra · cobertura): o que conta é o código da aplicação, não os testes nem as migrações.
[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests/*",
    "*/factories.py",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/dev.py",
    "config/settings/prod.py",
    # Ficha 06: o script de medição é uma ferramenta de linha de comandos, não a aplicação.
    "scripts/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
skip_empty = true
